[tool.poetry]
name = "discord-club-bot"
version = "0.1.0"
description = "Discord bot LVP with QR code generation via slash commands"
authors = ["Your Team <team@example.com>"]
readme = "README.md"
packages = [{ include = "clubbot", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
"discord.py" = "^2.4.0"
qrcode = {extras = ["pil"], version = "^7.4.2"}
Pillow = "^10.1.0"
python-dotenv = "^1.0.0"
youtube-transcript-api = "^0.6.2"
yt-dlp = "^2025.1.26"
openai = "^1.51.2"
rich = "^13.7.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
ruff = "^0.6.4"
mypy = "^1.11.2"
types-Pillow = "^10.2.0.20240822"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Ruff configuration (linter + formatter)
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "B",  # bugbear
    "BLE",# blind except
    "UP", # pyupgrade
    "N",  # pep8-naming
    "C4", # flake8-comprehensions
    "SIM",# flake8-simplify
    "RET",# flake8-return
    "C90",# mccabe complexity
    "RUF",# Ruff-specific rules
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"scripts/invite.py" = ["T201"]  # allow print in CLI utility
"typings/youtube_transcript_api/__init__.pyi" = ["N818"]
"src/clubbot/cogs/*.py" = ["BLE001"]  # cogs use top-level catch-all to standardize user errors
"scripts/*.py" = ["BLE001"]
"src/clubbot/orchestrator.py" = ["BLE001"]
"src/clubbot/services/transcript/app.py" = ["BLE001"]
"src/clubbot/services/transcript/provider.py" = ["BLE001"]
"src/clubbot/utils/*.py" = ["BLE001"]
"test_yt_api.py" = ["BLE001"]
"src/clubbot/services/jobs/runner.py" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
files = ["src"]
mypy_path = ["typings"]

[[tool.mypy.overrides]]
module = [
  "discord.*",
  "qrcode.*",
  "youtube_transcript_api.*",
  "yt_dlp.*",
  "openai.*",
]
ignore_missing_imports = true
