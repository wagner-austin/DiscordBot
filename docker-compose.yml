services:
  bot:
    build: .
    image: clubbot:latest
    container_name: clubbot-bot
    env_file:
      - .env
    # You can override/add envs at runtime via --env
    volumes:
      - metrics:/app/data
    restart: unless-stopped
  worker:
    image: clubbot:latest
    container_name: clubbot-worker
    env_file:
      - .env
    volumes:
      - metrics:/app/data
    command: poetry run rq worker transcript --with-scheduler
    restart: unless-stopped

volumes:
  metrics:
    external: true
    name: clubbot_metrics
